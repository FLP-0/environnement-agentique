name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: agentique_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d agentique_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:integration-only@127.0.0.1:5432/agentique_test

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run setup
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: npm run demo
      - name: Restart the services and check again
        run: |
          docker compose restart api worker postgres
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:3000/readyz")).ok)process.exit(0)}catch{} await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
          npm run demo
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Clean up ephemeral CI environment
        if: always()
        run: docker compose down --volumes
